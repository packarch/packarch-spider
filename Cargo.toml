[package]
name = "packarch-spider"
version = "2.2.0"
edition = "2024"
description = "Patience card games for Packarch: the 15 games of KPatience (Spider, FreeCell, Klondike, Golf...), Rust port"
license = "GPL-2.0-or-later"
repository = "https://github.com/packarch/packarch-spider"
authors = ["Fabrice Corraire <antidote1911@gmail.com>"]

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev]
# Le solveur et le rendu SVG sont trop lents sans optimisation.
opt-level = 2

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
resvg = "0.49"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastrand = "2"
rayon = "1"
